services:
  vllm-upstream:
    image: ${UPSTREAM_IMAGE:-vllm-upstream-gb10:dspark-tp}
    network_mode: host
    ipc: host
    shm_size: "64gb"
    ulimits:
      memlock: -1
      stack: 67108864
    gpus: all
    devices:
      - /dev/infiniband:/dev/infiniband
    volumes:
      - ${HF_CACHE:-${HOME}/.cache/huggingface}:/cache/huggingface
    environment:
      HF_HOME: /cache/huggingface
      HF_HUB_OFFLINE: "1"
      VLLM_HOST_IP: "${VLLM_HOST_IP:-}"
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
      FLASHINFER_CUDA_ARCH_LIST: "12.1a"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      NCCL_NET: "IB"
      NCCL_IB_DISABLE: "0"
      NCCL_IB_HCA: "${NCCL_IB_HCA}"
      NCCL_SOCKET_IFNAME: "${NCCL_SOCKET_IFNAME}"
      # Torch's Gloo CPU process group does NOT read NCCL_SOCKET_IFNAME. With
      # network_mode: host it resolves the node hostname, which /etc/hosts maps
      # to 127.0.1.1, so rank 0 advertises loopback and rank 1 dials 127.0.0.1
      # and gets ECONNREFUSED. Pin Gloo to the fabric NIC.
      GLOO_SOCKET_IFNAME: "${NCCL_SOCKET_IFNAME}"
      NCCL_IB_GID_INDEX: "${NCCL_IB_GID_INDEX:-}"
      NCCL_CROSS_NIC: "1"
      NCCL_CUMEM_ENABLE: "0"
      NCCL_DEBUG: "${NCCL_DEBUG:-WARN}"
      NCCL_NVLS_ENABLE: "0"
    entrypoint: ["bash", "-lc"]
    command:
      - >
        exec vllm serve ${DSPARK_MODEL:-deepseek-ai/DeepSeek-V4-Flash-DSpark}
        --served-model-name deepseek-v4-flash-dspark
        --host ${VLLM_HOST:-127.0.0.1}
        --port 8888
        --trust-remote-code
        --tensor-parallel-size 2
        --pipeline-parallel-size 1
        --kv-cache-dtype fp8_ds_mla
        --max-model-len ${MAX_MODEL_LEN:-200000}
        --max-num-seqs ${MAX_NUM_SEQS:-6}
        --max-num-batched-tokens ${MAX_NUM_BATCHED_TOKENS:-8192}
        --gpu-memory-utilization ${GPU_MEMORY_UTILIZATION:-0.80}
        --enable-prefix-caching
        --tokenizer-mode deepseek_v4
        --tool-call-parser deepseek_v4
        --enable-auto-tool-choice
        --reasoning-parser deepseek_v4
        --default-chat-template-kwargs '{"thinking":false}'
        --generation-config vllm
        --distributed-executor-backend mp
        --nnodes 2
        --node-rank ${NODE_RANK}
        --master-addr ${MASTER_ADDR}
        --master-port ${MASTER_PORT:-25000}
        ${HEADLESS:+--headless}
